name: Github CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: macOS
            os: macos-latest
            test_disabled:
            # We exclude the coq-core package
            packages: ./coqide-server.opam ./rocq*.opam
          - name: Windows
            os: windows-latest
            test_disabled: misc coq-makefile precomputed-time-tests
            # we don't support rocqide on Windows yet, so we filter it, see #20631
            packages: ./coqide-server.opam ./rocq-*.opam
      fail-fast: false

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 🐛 Special macOS Config
        if: matrix.os == 'macos-latest'
        run: brew install gnu-time

      - name: 🔭 Checkout code
        uses: actions/checkout@v4

      - name: Git checkout
        uses: actions/checkout@v3

      - name: System Information
        run: |
          .\dev\ci\platform\coq-pf-01-sysinfo.bat

      - name: Download Platform
        env:
          # Use a dedicated branch that follows master with some lag (manually updated)
          PLATFORM: "https://github.com/coq/platform/archive/coq-ci.zip"
        run: |
          .\dev\ci\platform\coq-pf-02-download.bat

      - name: Build Platform
        env:
          ARCH: ${{matrix.architecture}}
        shell: cmd
        run: |
          .\dev\ci\platform\coq-pf-03-build.bat

      - name: Build Installer
        env:
          ARCH: ${{matrix.architecture}}
        shell: cmd
        run: |
          .\dev\ci\platform\coq-pf-04-installer.bat

      - name: Upload Installer
        uses: actions/upload-artifact@v3
        with:
          ocaml-compiler: 4.14
          dune-cache: true

      - name: 🐫🐪🐫 Get Rocq dependencies
        run: opam install --deps-only ${{ matrix.packages }}

      - name: 🧱 Build Rocq
        run: opam exec -- make world

      - name: 🐛 Test Rocq
        run: opam exec -- make -j 4 -C test-suite DISABLED_SUBSYSTEMS='${{ matrix.test_disabled }}'
